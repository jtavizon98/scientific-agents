name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No TeX: tests needing pdflatex, biber or latexindent skip themselves.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils mupdf-tools
      - run: pip install pytest numpy matplotlib Pillow
      - run: python tools/check_repo.py
      - run: pytest -q tests
