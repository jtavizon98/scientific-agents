# Invoke with -m -l=<absolute path>; do not inherit per-user formatting settings.
defaultIndent: '  '
onlyOneBackUp: 1
maxNumberOfBackUps: 1
lookForAlignDelims:
  tabular: 0
  tabularx: 0
  longtable: 0
  array: 0
  align: 0
  aligned: 0
  alignat: 0
  cases: 0
verbatimEnvironments:
  lstlisting: 1
  minted: 1
  Verbatim: 1
  verbatim: 1
noIndentBlock:
  noindent: 1
modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 90
    multipleSpacesToSingle: 0
    blocksFollow:
      headings: 0
      commentOnPreviousLine: 0
      par: 1
      blankLine: 1
    blocksBeginWith:
      A-Z: 1
      a-z: 1
      other: 0
    blocksEndBefore:
      commentOnOwnLine: 1
      verbatim: 1
      other: '\\begin\{|\\end\{|\\\[|\\\]|\\item|&|\\\\'
